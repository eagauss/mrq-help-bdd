version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    groups:
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright"
          - "playwright-*"
      types:
        patterns:
          - "@types/*"
    ignore:
      # Pin @playwright/test until playwright-bdd 8.6+ supports the new
      # internal Playwright layout. Re-allow once that's released.
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
